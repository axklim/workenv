name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# ubuntu, not macos: every compiling step here runs the Go toolchain in
# Docker, and GitHub's macOS runners have no Docker daemon.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: gofmt, vet and the test suite
        run: make check

      # Steps below exercise the release path on every pull request. Finding
      # out at tag time that packaging is broken is the failure this prevents.
      - name: Cross-compile and package
        run: make dist VERSION=9.9.9

      - name: The packaged binary reports the stamped version
        # Also proves the tarball is flat: a nested layout would not put `we`
        # where this extraction looks for it.
        run: |
          set -euo pipefail
          tar -xzf dist/workenv-9.9.9-linux-intel.tar.gz -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/we" --version)" = "9.9.9"

      - name: Render and lint the formula
        # A separate render step, not `make formula | ruby -c`: the
        # implicit `bash -e {0}` shell for `run:` has no pipefail, so a
        # failing `make formula` piped into anything used to exit 0. `ruby
        # -c` also only proves the file parses; `brew style` proves it is a
        # valid formula, which is what actually gates the release.
        run: |
          set -euo pipefail
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          command -v brew >/dev/null || { echo "::error::brew not found on this runner"; exit 1; }
          # Rendered into a scratch tap, not just any directory: brew style
          # is path-sensitive (the file must sit under a Formula/ directory
          # for the right cop configuration), and a tap is also what lets
          # brew resolve the formula by name for the version check below.
          TAP="$(brew --repository)/Library/Taps/local/homebrew-citap"
          mkdir -p "$TAP/Formula"
          make formula VERSION=9.9.9 > "$TAP/Formula/workenv.rb"
          brew style "$TAP/Formula/workenv.rb"

          # The check that matters, and the one whose absence shipped a
          # v0.1.1 formula reporting its version as "64": brew style, brew
          # audit and ruby -c all pass on a formula whose version Homebrew
          # resolves to garbage. Only asking brew what it actually resolved
          # catches it.
          # 9.9.9 rather than a marker like 0.0.0-ci: Homebrew's scan strips
          # a non-numeric suffix, so 0.0.0-ci resolves to 0.0.0 and this
          # check would fail on its own placeholder.
          resolved="$(brew info --json=v2 --formula local/citap/workenv \
            | jq -r '.formulae[0].versions.stable')"
          test "$resolved" = "9.9.9" || {
            echo "::error::formula resolves to version '$resolved', expected 9.9.9"
            exit 1
          }
